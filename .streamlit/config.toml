[theme]
# Cor principal (botões, barras de progresso, sliders)
primaryColor = "#b42f2fff"

# Cor do fundo da página principal
backgroundColor = "#0e1710ff"

# Cor do fundo da barra lateral
secondaryBackgroundColor = "#262730"

# Cor do texto normal
textColor = "#FAFAFA"

# Fonte do texto (opções: "sans serif", "serif", "monospace")
font = "sans serif"